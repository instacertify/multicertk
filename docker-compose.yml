services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: certko
      POSTGRES_PASSWORD: certko
      POSTGRES_DB: certko
    ports:
      - "5432:5432"
    volumes:
      - certko_pg:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: certko_dev_master_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - certko_meili:/meili_data

  directus:
    image: directus/directus:11
    ports:
      - "8055:8055"
    environment:
      KEY: certko-directus-key
      SECRET: certko-directus-secret
      ADMIN_EMAIL: admin@certko.com
      ADMIN_PASSWORD: certko-admin
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: certko
      DB_USER: certko
      DB_PASSWORD: certko
      WEBSOCKETS_ENABLED: "false"
      PUBLIC_URL: http://localhost:8055
    depends_on:
      - postgres

volumes:
  certko_pg:
  certko_meili:
