services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: certko
      POSTGRES_PASSWORD: certko
      POSTGRES_DB: certko
    ports:
      - "5432:5432"
    volumes:
      - certko_pg:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: certko_dev_master_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - certko_meili:/meili_data

volumes:
  certko_pg:
  certko_meili:
