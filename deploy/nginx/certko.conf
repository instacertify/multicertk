# Certko — Nginx front door for the Next.js app managed by PM2.
# TLS termination and gzip sit here; Node only sees localhost.

upstream certko_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name certko.com www.certko.com;

    # Redirect HTTP → HTTPS in production. Keep the ACME challenge path open.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://certko.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name certko.com www.certko.com;

    ssl_certificate     /etc/letsencrypt/live/certko.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/certko.com/privkey.pem;

    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /_next/static/ {
        proxy_pass http://certko_next;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://certko_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
